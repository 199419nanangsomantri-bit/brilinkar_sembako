name: Build APK from HTML

on:
  push:
    branches: [ main ] # Ganti menjadi 'master' jika branch utama Anda bernama master
  workflow_dispatch: # Memungkinkan build manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        uses: darkshredder/web-to-app-action@main
        with:
          # Path tempat file index.html Anda berada. 
          # Gunakan "." jika index.html ada di root repo.
          build-folder-path: "."
          
          # Nama aplikasi yang akan muncul di HP
          app-name: "AR Sembako BRILink"
          
          # Folder tempat file APK akan disimpan sementara
          output-folder-path: "apk-output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-Sembako-APK
          # Mengambil semua file dari folder output
          path: apk-output/
