name: Build APK BRILink

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "AR Sembako BRILink" "com.arsembako.brilink" --web-dir=www

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Assets
        run: npx cap sync android

      - name: Fix Kotlin Duplicate Class Issue
        run: |
          echo "
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
          }
          " >> android/app/build.gradle

      - name: Replace App Icons
        run: |
          if [ -f "www/icon.png" ]; then
            echo "Menyalin ikon kustom ke folder Android..."
            rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            cp www/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp www/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Ikon aplikasi berhasil diganti."
          else
            echo "Peringatan: www/icon.png tidak ditemukan, memakai ikon default."
          fi

      - name: Replace Splash Screen
        run: |
          if [ -f "www/splash.png" ]; then
            echo "Menggunakan splash.png kustom..."
            SPLASH_FILE="www/splash.png"
          elif [ -f "www/icon.png" ]; then
            echo "Menggunakan icon.png sebagai pengganti sementara..."
            SPLASH_FILE="www/icon.png"
          else
            echo "Tidak ada gambar splash/icon, melewati..."
            exit 0
          fi

          cp $SPLASH_FILE android/app/src/main/res/drawable/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-land-hdpi/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-land-mdpi/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-land-xhdpi/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-land-xxhdpi/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-land-xxxhdpi/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-port-hdpi/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-port-mdpi/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-port-xhdpi/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-port-xxhdpi/splash.png
          cp $SPLASH_FILE android/app/src/main/res/drawable-port-xxxhdpi/splash.png
          echo "Splash screen berhasil diganti."

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-Sembako-BRILink-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
